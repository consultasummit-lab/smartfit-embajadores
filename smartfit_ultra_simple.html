<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFIT Embajadores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #FBB92C 0%, #FF8C00 100%); padding: 40px 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .header h1 { color: #000; font-size: 32px; margin-bottom: 10px; }
        .form-section { background: white; padding: 30px; margin-bottom: 20px; border-radius: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
        .multiple-select { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .checkbox-group { display: flex; align-items: center; }
        .checkbox-group input { margin-right: 8px; accent-color: #FBB92C; }
        .checkbox-group label { margin: 0; font-weight: 400; cursor: pointer; }
        .button-group { display: flex; gap: 15px; margin-top: 30px; }
        button { flex: 1; padding: 14px; font-size: 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: linear-gradient(135deg, #FBB92C 0%, #FF8C00 100%); color: #000; }
        .btn-reset { background: #f0f0f0; color: #333; }
        .result { margin-top: 30px; display: none; text-align: center; }
        .result.show { display: block; }
        .ticket-canvas { border: 3px solid #FBB92C; border-radius: 8px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        .download-btn { background: linear-gradient(135deg, #FBB92C 0%, #FF8C00 100%); color: #000; width: 100%; padding: 12px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏋️ SmartFIT Embajadores</h1>
            <p>Descubre tu perfil 💪</p>
        </div>

        <form id="form">
            <div class="form-section">
                <div class="form-group">
                    <label>Tu nombre:</label>
                    <select id="nombre" required>
                        <option value="">Selecciona</option>
                        <option value="Charly">Charly</option>
                        <option value="Carolina">Carolina</option>
                        <option value="Thavatta">Thavatta</option>
                        <option value="Steph">Steph</option>
                        <option value="Fizzy">Fizzy</option>
                        <option value="Daniela">Daniela</option>
                        <option value="Mishell">Mishell</option>
                        <option value="Montse">Montse</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Personalidad:</label>
                    <select id="personalidad" required>
                        <option value="">Selecciona</option>
                        <option value="Muy extrovertido(a)">Muy extrovertido(a)</option>
                        <option value="Sociable">Sociable</option>
                        <option value="Tranquilo(a)">Tranquilo(a)</option>
                        <option value="Reservado(a)">Reservado(a)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Motivación:</label>
                    <select id="motivacion" required>
                        <option value="">Selecciona</option>
                        <option value="Salud">Salud es su prioridad</option>
                        <option value="Transformación">En transformación personal</option>
                        <option value="Fuerza">Construye fuerza</option>
                        <option value="Mental">Entrena desde el alma</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Entrenamiento:</label>
                    <select id="entrenar" required>
                        <option value="">Selecciona</option>
                        <option value="Disciplinado">Muy disciplinado(a)</option>
                        <option value="Constante">Constante</option>
                        <option value="Intenso">Intensamente</option>
                        <option value="Diverso">Me gusta probar de todo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Intereses (máximo 3):</label>
                    <div class="multiple-select">
                        <div class="checkbox-group"><input type="checkbox" value="Viajar"><label>Viajar</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Café"><label>Café</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Leer"><label>Leer</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Perritos"><label>Perritos</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Música"><label>Música</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Deporte"><label>Deporte</label></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Comunidad:</label>
                    <div class="multiple-select">
                        <div class="checkbox-group"><input type="checkbox" value="Principiantes"><label>Principiantes</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Transformación"><label>Transformación</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Profesionistas"><label>Profesionistas</label></div>
                        <div class="checkbox-group"><input type="checkbox" value="Mamás"><label>Mamás</label></div>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-submit" onclick="generar()">Generar Perfil</button>
                <button type="reset" class="btn-reset">Limpiar</button>
            </div>
        </form>

        <div id="result" class="result">
            <canvas id="canvas" class="ticket-canvas" width="540" height="960"></canvas>
            <button class="download-btn" onclick="descargar()">📥 Descargar</button>
        </div>
    </div>

    <script>
        const CODIGOS = { Charly: 'CHARLYSMART', Carolina: 'CAROSMART', Thavatta: 'THAVSMART', Steph: 'STEPHSMART', Fizzy: 'FIZZYSMART', Daniela: 'DANYSMART', Mishell: 'MISHSMART', Montse: 'MONTSESMART' };

        function generar() {
            const nombre = document.getElementById('nombre').value;
            const personalidad = document.getElementById('personalidad').value;
            const motivacion = document.getElementById('motivacion').value;
            const entrenar = document.getElementById('entrenar').value;
            
            const intereses = [];
            document.querySelectorAll('.form-group:nth-child(5) input:checked').forEach(cb => intereses.push(cb.value));
            
            const comunidad = [];
            document.querySelectorAll('.form-group:nth-child(6) input:checked').forEach(cb => comunidad.push(cb.value));

            if (!nombre || !personalidad || !motivacion || !entrenar) {
                alert('Completa todos los campos obligatorios');
                return;
            }

            dibujar(nombre, personalidad, motivacion, entrenar, intereses, comunidad);
            document.getElementById('result').classList.add('show');
        }

        function dibujar(nombre, personalidad, motivacion, entrenar, intereses, comunidad) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const w = 540, h = 960;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#FBB92C';
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, w, h);

            ctx.fillStyle = '#FBB92C';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('smart', w/2, 50);
            ctx.font = 'bold 36px Arial';
            ctx.fillText('fit', w/2, 90);

            ctx.font = 'bold 32px Arial';
            ctx.fillText(nombre.toUpperCase(), w/2, 150);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('EMBAJADORA SMARTFIT', w/2, 165);

            ctx.strokeStyle = '#FBB92C';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(50, 180);
            ctx.lineTo(w-50, 180);
            ctx.stroke();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            let y = 210;

            ctx.fillText('✨ ' + personalidad, 50, y); y += 22;
            ctx.fillText('🧠 ' + motivacion, 50, y); y += 22;
            ctx.fillText('💪 ' + entrenar, 50, y); y += 22;

            if (intereses.length > 0) {
                ctx.fillText('❤️ ' + intereses.slice(0,3).join(', '), 50, y);
                y += 28;
            }

            y += 10;
            ctx.strokeStyle = '#FBB92C';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(50, y);
            ctx.lineTo(w-50, y);
            ctx.stroke();

            y += 20;
            ctx.fillStyle = '#FBB92C';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('Tu comunidad es:', 50, y);
            y += 18;

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '10px Arial';
            if (comunidad.length > 0) {
                ctx.fillText(comunidad.slice(0,3).join(' • '), 50, y);
            } else {
                ctx.fillText('Personas apasionadas por crecer', 50, y);
            }

            y = h - 140;
            ctx.strokeStyle = '#FBB92C';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(50, y);
            ctx.lineTo(w-50, y);
            ctx.stroke();

            const codigo = CODIGOS[nombre];
            y += 20;
            ctx.fillStyle = '#FBB92C';
            ctx.font = 'bold 38px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(codigo, w/2, y);

            y += 28;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 11px Arial';
            ctx.fillText('Tu Código de Descuento', w/2, y);

            y += 16;
            ctx.fillStyle = '#FBB92C';
            ctx.font = '9px Arial';
            ctx.fillText('Usa en tu inscripción', w/2, y);
        }

        function descargar() {
            const canvas = document.getElementById('canvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `SmartFIT_${Date.now()}.png`;
            link.click();
        }
    </script>
</body>
</html>
